name = "nexus-a1"
main = "worker.js"
compatibility_date = "2024-12-01"


# ⭐ YAHAN BHI ADD KARO (For better performance)
[env.production]
vars = { ENVIRONMENT = "production" }

[[kv_namespaces]]
binding = "KV"
id = "7f3a894d6cb041b3a7c25546f8714342"

[[d1_databases]]
binding = "DB"
database_name = "nexus_users"
database_id = "80563f0c-f9f7-4af4-aa12-941a093cb88e"

[[vectorize]]
binding = "VECTOR"
index_name = "captain-cool-index"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TIME_MCP"
class_name = "TimeMcpServer"

[[migrations]]
tag = "v1"
new_classes = ["TimeMcpServer"]
compatibility_flags = ["nodejs_compat"]
