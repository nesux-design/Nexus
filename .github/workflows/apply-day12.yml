name: Apply day12 schema spread

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day12_schema_spread.py'
      - '.github/workflows/apply-day12.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day12_schema_spread.py
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then exit 1; fi
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY12-SCHEMA-SPREAD.md
          git diff --staged --quiet || git commit -m "feat(day12): schema v2 on empty-msg, conv, memory, premium"
          git push origin HEAD:main
