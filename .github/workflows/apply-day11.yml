name: Apply day11 schema v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day11_schema_v2.py'
      - '.github/workflows/apply-day11.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day11_schema_v2.py
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then exit 1; fi
          grep -q 'schemaVersion: 2' worker.ts
          grep -q 'function apiError' worker.ts
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY11-SCHEMA-V2.md
          git diff --staged --quiet || git commit -m "feat(day11): schema v2 requestId/created on chat + core errors"
          git push origin HEAD:main
