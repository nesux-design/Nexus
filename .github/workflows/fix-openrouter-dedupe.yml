name: Fix openrouter chain dedupe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_openrouter_chain_dedupe.py'
      - '.github/workflows/fix-openrouter-dedupe.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_openrouter_chain_dedupe.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: dedupe openrouter in preferred modelChain"
          git push origin HEAD:main
