name: Apply master prompt batch2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_master_prompt_batch2.py'
      - '.github/workflows/apply-master-prompt-batch2.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch2 to worker.ts
        run: |
          set -e
          python3 scripts/apply_master_prompt_batch2.py
          grep -n 'Answer formation (ChatGPT-class)' worker.ts | head -2
          grep -n 'heuristicRelatedQuestions' worker.ts | head -3
          grep -n 'body.provider || body.modelPreference' worker.ts | head -2
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "feat: ChatGPT-class answer style, follow-up fallback, provider alias"
          git push origin HEAD:main
