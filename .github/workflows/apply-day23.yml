name: Apply day23 rate limit headers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day23_rate_limit_headers.py'
      - '.github/workflows/apply-day23.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day23_rate_limit_headers.py
      - run: |
          grep -q 'RATE_LIMIT_META_V1' worker.ts
          grep -q 'X-RateLimit-Limit' worker.ts
          grep -q 'RATE_LIMITED' worker.ts
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY23-RATE-LIMIT-HEADERS.md
          git diff --staged --quiet || git commit -m "feat(day23): rate-limit headers + RATE_LIMITED schema v2"
          git push origin HEAD:main
