name: Fix mcp location assert

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-mcp-location-assert.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexus-a1-ai-upgrade-2026-10
      - name: Fix return shape
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('mcp-client.js')
          t = p.read_text()
          # Ensure property form that matches regression: location: res.headers.get("location")
          t2 = t.replace(
            'wwwAuthenticate: res.headers.get("www-authenticate") || null,\n    location\n  };',
            'wwwAuthenticate: res.headers.get("www-authenticate") || null,\n    location: res.headers.get("location") || null\n  };'
          )
          if t2 == t:
            # alternate shorthand without prior const
            t2 = re.sub(
              r'(wwwAuthenticate: res\.headers\.get\("www-authenticate"\) \|\| null,)\s*\n\s*location\s*\n(\s*\};)',
              r'\1\n    location: res.headers.get("location") || null\n\2',
              t
            )
          if 'location: res.headers.get("location")' not in t2:
              raise SystemExit('patch failed')
          p.write_text(t2)
          print('patched ok')
          PY
          # run static test
          npm ci
          npm test
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add mcp-client.js
          git diff --staged --quiet || git commit -m "fix(mcp): location property form for OAuth Location capture (CI)"
          git push origin HEAD:nexus-a1-ai-upgrade-2026-10
