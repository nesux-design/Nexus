name: Apply pending smalls

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-pending-smalls.yml'
      - 'scripts/patch-pending-smalls.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: |
          set -e
          python3 scripts/patch-pending-smalls.py
          grep -q istString worker.ts
          grep -q 'CRITICAL TIME' worker.ts
          grep -q pureTimeRe worker.ts
          grep -q 'Order fixed: Gemini' worker.ts
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then echo no changes; else
            git commit -m "fix: live IST/UTC time + pure clock path + vision Gemini→Gemma→GLM→OpenRouter + faster TTS"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
