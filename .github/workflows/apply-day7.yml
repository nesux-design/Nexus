name: Apply day7 chat meta flags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day7_chat_meta_flags.py'
      - '.github/workflows/apply-day7.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day7_chat_meta_flags.py
      # syntax guard: no broken enrichedContext openers
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then echo BROKEN_STRING; exit 1; fi
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY7-FLAGS-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day7): chat usageToday/role + feature flags"
          git push origin HEAD:main
