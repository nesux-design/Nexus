name: Apply live time awareness fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-time-fix.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply time awareness patches
        run: |
          set -e
          python3 << 'PY'
import re
content = open("worker.ts").read()
assert "PLACEHOLDER" not in content[:200]

# 1. Replace getCurrentDate
old = '''function getCurrentDate() {
  const now = /* @__PURE__ */ new Date();
  return {
    year: now.getUTCFullYear(),
    month: String(now.getUTCMonth() + 1).padStart(2, "0"),
    day: String(now.getUTCDate()).padStart(2, "0"),
    hours: String(now.getUTCHours()).padStart(2, "0"),
    minutes: String(now.getUTCMinutes()).padStart(2, "0"),
    full: now.getUTCFullYear() + "-" + String(now.getUTCMonth() + 1).padStart(2, "0") + "-" + String(now.getUTCDate()).padStart(2, "0"),
    timestamp: Date.now(),
