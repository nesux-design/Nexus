name: Apply day14b conversationId TTS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day14b_conversation_id_tts.py'
      - '.github/workflows/apply-day14b.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day14b_conversation_id_tts.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix(day14): conversationId on all chat returns + redeploy"
          git push origin HEAD:main
