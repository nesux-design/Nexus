name: Apply global quality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-global-quality.yml'
      - 'scripts/patch-global-quality.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: |
          set -e
          python3 scripts/patch-global-quality.py
          grep -q formatInZone worker.ts
          grep -q withSystem worker.ts || grep -q 'fair prompts' scripts/patch-global-quality.py
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then echo no changes; else
            git commit -m "fix: global timezones (not only IST) + fair mimo/code prompts (no model id change)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
