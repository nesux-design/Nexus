name: Apply day3 auth search conv

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day3_auth_search_conv.py'
      - '.github/workflows/apply-day3.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day3_auth_search_conv.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY3-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day3): userId auth bind, search quota, conversations USER_REQUIRED"
          git push origin HEAD:main
