name: Fix thread model string syntax

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_thread_model_strings.py'
      - '.github/workflows/fix-thread-strings.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix_thread_model_strings.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: unterminated string in THREAD_MODEL history (wrangler)"
          git push origin HEAD:main
