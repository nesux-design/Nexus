name: Apply day17 memory inject

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day17_memory_inject.py'
      - '.github/workflows/apply-day17.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day17_memory_inject.py
      - run: |
          if grep -nE 'sessionContext \+ "$|\.join\("$|enrichedContext = "$' worker.ts; then exit 1; fi
          grep -q 'MEMORY_INJECT_V1' worker.ts
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY17-MEMORY-INJECT.md
          git diff --staged --quiet || git commit -m "feat(day17): inject explicit memory into chat context"
          git push origin HEAD:main
