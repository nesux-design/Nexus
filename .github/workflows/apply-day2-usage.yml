name: Apply day2 usage hooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day2_usage_hooks.py'
      - '.github/workflows/apply-day2-usage.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day2_usage_hooks.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY2-USAGE-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day2): premium_status usageToday + voice daily limit"
          git push origin HEAD:main
