name: Wire MCP into worker.ts
on:
  workflow_dispatch:
    inputs:
      confirm_branch_write:
        description: "Type yes only after reviewing the changes; this workflow writes to the selected non-main branch."
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
jobs:
  skip_automatic_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: No-op for automatic push events
        run: echo "Manual-only workflow; no write operation performed for push events."
  wire:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.confirm_branch_write == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply MCP wire
        run: python3 scripts/apply_mcp_wire.py
      - name: Commit if changed
        run: |
          git config user.name "nexus-mcp-bot"
          git config user.email "nexus@users.noreply.github.com"
          git add worker.ts
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(mcp): wire MCP gateway into worker.ts (Claude/Grok style)"
            git push origin HEAD
          fi
