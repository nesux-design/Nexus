name: Apply day5 conversation tiers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day5_conversation_tiers.py'
      - '.github/workflows/apply-day5-conversations.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day5_conversation_tiers.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY5-CONVERSATION-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day5): conversation + message caps by plan"
          git push origin HEAD:main
