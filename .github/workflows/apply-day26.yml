name: Apply day26 admin audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day26_admin_audit.py'
      - '.github/workflows/apply-day26.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day26_admin_audit.py
      - run: |
          grep -q 'appendAuditLog' worker.ts
          grep -q 'admin_audit_list' worker.ts
          grep -q 'audit_log' worker.ts
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY26-ADMIN-AUDIT.md
          git diff --staged --quiet || git commit -m "feat(day26): admin audit log + admin_audit_list"
          git push origin HEAD:main
