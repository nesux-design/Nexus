name: Restore mcp-client final

on:
  workflow_dispatch:
    inputs:
      confirm_branch_write:
        description: "Type yes only after reviewing the changes; this workflow writes to the selected non-main branch."
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"

jobs:
  skip_automatic_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: No-op for automatic push events
        run: echo "Manual-only workflow; no write operation performed for push events."
  restore:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.confirm_branch_write == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore mcp-client.js
        run: |
          set -e
          curl -fsSL -o mcp-client.js "https://raw.githubusercontent.com/nesux-design/Nexus/6b8c00eb7f1749a9e9dbfe3d37c96ab90239b63e/mcp-client.js"
          wc -c mcp-client.js
          head -3 mcp-client.js
          test $(wc -c < mcp-client.js) -gt 5000
      - name: Commit
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus@users.noreply.github.com"
          git add mcp-client.js
          git diff --staged --quiet || git commit -m "fix: restore mcp-client.js (final)"
          git push origin HEAD
