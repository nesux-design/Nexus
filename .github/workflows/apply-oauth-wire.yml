name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Spotify error handling + scopes
        run: |
          set -e
          python3 scripts/fix_spotify_errors.py
          grep -q user-top-read worker.ts
          grep -q 'pluginAction || body.tool' worker.ts
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_spotify_errors.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: Spotify scopes + real API error handling (not fake success)"
          git push origin HEAD:main
