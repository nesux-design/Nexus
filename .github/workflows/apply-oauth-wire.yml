name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply OAuth userId + Claude plugin force fix
        run: |
          set -e
          test -f worker.ts
          test -f scripts/fix_oauth_userid.py
          python3 scripts/fix_oauth_userid.py
          grep -q 'provider: "discord", userId' worker.ts
          grep -q FORCE_PLUGIN_FALLBACK worker.ts
          grep -q pluginHint worker.ts
          wc -c worker.ts
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_oauth_userid.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: OAuth userId binding + Claude-style plugin force (no fake cannot access)"
          git push origin HEAD:main
