name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Figma get_me
        run: |
          set -e
          python3 scripts/fix_figma_get_me.py
          grep -q 'get_me", "me", "get_user"' worker.ts
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_figma_get_me.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: Figma get_me uses /v1/me without requiring fileId"
          git push origin HEAD:main
