name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add GitHub OAuth provider
        run: |
          set -e
          python3 scripts/fix_github_oauth.py
          grep -q GITHUB_CLIENT_ID worker.ts
          grep -q '"github"' worker.ts
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_github_oauth.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: GitHub OAuth route (OAUTH_CONFIG + generic providers)"
          git push origin HEAD:main
