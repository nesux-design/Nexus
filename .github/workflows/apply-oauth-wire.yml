name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prefer runPluginApi for Spotify and other OAuth apps
        run: |
          set -e
          test -f worker.ts
          test -f scripts/fix_spotify_runplugin.py
          python3 scripts/fix_spotify_runplugin.py
          grep -q 'known plugin APIs first' worker.ts
          wc -c worker.ts
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_spotify_runplugin.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: Spotify/Slack use runPluginApi (no endpoint required for known tools)"
          git push origin HEAD:main
