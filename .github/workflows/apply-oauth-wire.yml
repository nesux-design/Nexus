name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Canva REST paths
        run: |
          set -e
          python3 scripts/fix_canva_rest.py
          grep -q 'api.canva.com/rest/v1/designs' worker.ts
          ! grep -q 'api.canva.com/v1/' worker.ts || true
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add worker.ts scripts/fix_canva_rest.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: Canva designs endpoint api.canva.com/rest/v1"
          git push origin HEAD:main
