name: Apply OAuth Wire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Twitch Linear Asana APIs
        run: |
          set -e
          python3 scripts/fix_twitch_linear_asana.py
          grep -q 'api.twitch.tv/helix/users' oauth-plugins.js
          grep -q 'api.linear.app/graphql' oauth-plugins.js
          grep -q 'app.asana.com' oauth-plugins.js
          echo FIX_OK

      - name: Commit and push
        run: |
          set -e
          git config user.name "nexus-oauth-wire"
          git config user.email "nexus-oauth-wire@users.noreply.github.com"
          git add oauth-plugins.js scripts/fix_twitch_linear_asana.py
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix: Twitch get_user + Linear issues + Asana tasks in runPluginApi"
          git push origin HEAD:main
