name: Fix searchQuota string syntax

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_search_quota_string.py'
      - '.github/workflows/fix-search-quota-string.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix_search_quota_string.py
      - name: Verify worker parses
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('worker.ts','utf8'); if(/enrichedContext = \"\s*$/m.test(s.split(/\n/).find(l=>l.includes('searchQuota'))? '' : s)) process.exit(0);"
          # crude check: no line ends with enrichedContext = "
          if grep -n 'enrichedContext = "$' worker.ts; then echo FAIL; exit 1; fi
          echo PARSE_OK
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: unterminated string in searchQuota (wrangler deploy)"
          git push origin HEAD:main
