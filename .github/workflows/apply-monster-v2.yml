name: Apply monster v2 AI-native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-monster-v2.yml'
      - 'scripts/patch-monster-v2-ai-native.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard
        run: |
          set -e
          test -s worker.ts
          ! grep -q PLACEHOLDER_TOO_LARGE worker.ts
          wc -c worker.ts
      - name: Apply v2 patch
        run: |
          set -e
          python3 scripts/patch-monster-v2-ai-native.py
          grep -q 'mimo", "gemini", "groq"' worker.ts
          grep -q 'codeChainResult' worker.ts
          grep -q 'AI-native plan' worker.ts
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
          wc -c worker.ts
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "fix: AI-native routing (no keyword force) + code chain mimo→gemini→groq + code_help pro path"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
