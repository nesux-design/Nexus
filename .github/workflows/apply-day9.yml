name: Apply day9 web_search flag

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day9_web_search_flag.py'
      - '.github/workflows/apply-day9.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day9_web_search_flag.py
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then exit 1; fi
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY9-WEB-SEARCH-FLAG-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day9): web_search flag skips live search only"
          git push origin HEAD:main
