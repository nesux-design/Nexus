name: Apply master prompt batch3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_master_prompt_batch3.py'
      - '.github/workflows/apply-master-prompt-batch3.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch3
        run: |
          set -e
          python3 scripts/apply_master_prompt_batch3.py
          grep -n 'openrouter' worker.ts | head -20
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "feat: OpenRouter in model chain + stream completion meta"
          git push origin HEAD:main
