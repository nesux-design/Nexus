name: Apply day8 flag enforce

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day8_flag_enforce.py'
      - '.github/workflows/apply-day8.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day8_flag_enforce.py
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then exit 1; fi
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY8-FLAG-ENFORCE-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day8): enforce feature flags with FEATURE_DISABLED"
          git push origin HEAD:main
