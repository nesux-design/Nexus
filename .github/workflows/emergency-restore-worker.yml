name: Emergency restore worker.ts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-worker.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore worker from last good tip
        run: |
          set -e
          # Last known good before accidental PLACEHOLDER (e9945547 tree, blob 8b85de36)
          curl -fsSL "https://raw.githubusercontent.com/nesux-design/Nexus/e9945547b1565a8d4f0c831e934ef664e159fc16/worker.ts" -o worker.ts
          test -s worker.ts
          ! grep -q PLACEHOLDER_TOO_LARGE worker.ts
          ! grep -q "PLACEHOLDER_WILL_FAIL" worker.ts
          wc -c worker.ts
          head -c 80 worker.ts
      - name: esbuild smoke
        run: npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit restored worker
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "already good"
          else
            git commit -m "fix: restore worker.ts from e9945547 good tip (unbreak PLACEHOLDER accident)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
