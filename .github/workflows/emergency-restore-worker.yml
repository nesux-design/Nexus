name: Emergency restore worker.ts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-worker.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore worker from day39
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/nesux-design/Nexus/6d523c8c6c23715e5a959b4aa35afdf3c1311596/worker.ts" -o worker.ts
          test -s worker.ts
          grep -q PHASE_B_DAY39 worker.ts
          ! grep -q PLACEHOLDER_WILL_FAIL worker.ts
          wc -c worker.ts
      - name: esbuild smoke
        run: npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit restored worker
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "already good"
          else
            git commit -m "fix: restore worker.ts from phase-b-day39 baseline (remove PLACEHOLDER)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
