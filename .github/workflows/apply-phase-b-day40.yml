name: Apply phase B day40 MCP reauth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_phase_b_day40_mcp_reauth.py'
      - '.github/workflows/apply-phase-b-day40.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore worker.ts from day39 if corrupted
        run: |
          if [ ! -s worker.ts ] || grep -q 'PLACEHOLDER_WILL_FAIL' worker.ts || ! grep -q 'PHASE_B_DAY39' worker.ts; then
            echo "Restoring worker.ts from day39 baseline"
            curl -fsSL "https://raw.githubusercontent.com/nesux-design/Nexus/6d523c8c6c23715e5a959b4aa35afdf3c1311596/worker.ts" -o worker.ts
          fi
          wc -c worker.ts
          grep -c PHASE_B_DAY39 worker.ts || true
      - name: Apply day40 patch
        run: python3 scripts/apply_phase_b_day40_mcp_reauth.py
      - name: esbuild smoke
        run: |
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "feat(phase-b-day40): MCP reauth authorize_url + stream oauth probe parity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
