name: Apply phase B day40 MCP reauth

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_phase_b_day40_mcp_reauth.py'
      - '.github/workflows/apply-phase-b-day40.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply day40 (safe)
        run: python3 scripts/apply_phase_b_day40_mcp_reauth.py
      - name: Refuse PLACEHOLDER
        run: |
          if grep -q 'PLACEHOLDER_WILL_FAIL' worker.ts; then
            echo "ABORT: PLACEHOLDER in worker.ts"
            exit 1
          fi
          test $(wc -c < worker.ts) -gt 10000
          grep -q PHASE_B_DAY40 worker.ts
          grep -q PHASE_B_DAY39 worker.ts
      - name: esbuild smoke
        run: npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit worker only if real patch
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "feat(phase-b-day40): MCP reauth authorize_url + stream oauth probe parity"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
