name: Worker checks

on:
  push:
    branches:
      - nexus-a1-ai-upgrade-2026-10
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply semver-safe dependency fixes on explicit request
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dependency-fix]')
        run: |
          npm install --save-dev wrangler@^4
          npm audit fix
      - name: Static regression checks
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Commit verified dependency updates
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dependency-fix]')
        run: |
          git config user.name "nexus-security-bot"
          git config user.email "nexus-security-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "No dependency changes"; exit 0; fi
          git commit -m "security: apply semver-safe npm audit fixes"
          git push origin HEAD
      - name: TypeScript debt report
        run: npm run typecheck
        continue-on-error: true
