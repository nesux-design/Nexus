name: Worker checks

on:
  push:
    branches:
      - nexus-a1-ai-upgrade-2026-10
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static regression checks
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: TypeScript debt report
        run: npm run typecheck
        continue-on-error: true
