name: Apply day29 contract freeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day29_contract_freeze.py'
      - '.github/workflows/apply-day29.yml'
      - 'docs/API-CONTRACT-V1.md'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day29_contract_freeze.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/API-CONTRACT-V1.md
          git diff --staged --quiet || git commit -m "docs(day29): API contract v1 freeze + admin_audit_list in catalog"
          git push origin HEAD:main
