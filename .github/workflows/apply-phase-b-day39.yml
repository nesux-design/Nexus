name: Apply phase B day39 MCP oauth force

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_phase_b_day39_mcp_oauth_force.py'
      - '.github/workflows/apply-phase-b-day39.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/apply_phase_b_day39_mcp_oauth_force.py
      - name: esbuild smoke
        run: |
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "feat(phase-b-day39): MCP oauth-missing forces reauth not CLI tutorial"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
