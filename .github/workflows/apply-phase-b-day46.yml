name: Apply phase B day46

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_phase_b_day46.py'
      - '.github/workflows/apply-phase-b-day46.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Day46
        run: |
          set -e
          python3 scripts/apply_phase_b_day46.py
          grep -q 'PHASE_B_DAY46' worker.ts
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          if git diff --staged --quiet; then echo no changes; else
            git commit -m "fix(phase-b-day46): MCP force-route overrides web_search (cloudflare whoami)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
