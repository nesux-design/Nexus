name: Fix Groq tools + embedding dims

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_groq_tools_and_embeddings.py'
      - '.github/workflows/fix-groq-embed.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix_groq_tools_and_embeddings.py
      - name: esbuild smoke
        run: |
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: Groq tool_use_failed retry + embedding outputDimensionality 1536"
          git push origin HEAD:main
