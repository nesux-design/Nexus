name: Fix admin_audit_list syntax

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_admin_audit_list_syntax.py'
      - '.github/workflows/fix-admin-audit-syntax.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix_admin_audit_list_syntax.py
      - name: syntax smoke (esbuild)
        run: |
          npx --yes esbuild worker.ts --bundle --platform=neutral --external:cloudflare:workers --outfile=/tmp/w.js
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: admin_audit_list syntax (wrangler Unterminated/Expected colon)"
          git push origin HEAD:main
