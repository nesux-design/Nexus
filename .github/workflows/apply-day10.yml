name: Apply day10 searchPerformed honesty

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_day10_search_performed.py'
      - '.github/workflows/apply-day10.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_day10_search_performed.py
      - run: |
          if grep -n 'enrichedContext = "$' worker.ts; then exit 1; fi
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts docs/DAY10-SEARCH-PERFORMED-NOTES.md
          git diff --staged --quiet || git commit -m "feat(day10): searchPerformed only when search actually ran"
          git push origin HEAD:main
