name: Revert keyword search gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/revert_keyword_search_gate.py'
      - '.github/workflows/revert-keyword-search-gate.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/revert_keyword_search_gate.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "fix: web search routing back to AI needsSearch only"
          git push origin HEAD:main
