name: Apply god-level answer pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_god_level_answer_pipeline.py'
      - '.github/workflows/apply-god-level-answer.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/apply_god_level_answer_pipeline.py
      - name: Commit
        run: |
          git config user.name nexus-bot
          git config user.email nexus@users.noreply.github.com
          git add worker.ts
          git diff --staged --quiet || git commit -m "feat: strip tool citation junk, recover sources, honest searchPerformed"
          git push origin HEAD:main
